# Live intern: Azure gpt-5.6-sol + Gym FineWeb retrieval + official Gym judges.
run_name: live-gym
output_dir: runs
seed: 17
concurrency: 1

dataset:
  name: deep_research_gym
  language: en
  limit: 1
  query_ids:
    - "923549"

agent:
  name: pilot
  config: configs/agents/pilot.yaml

llm:
  provider: azure
  model: gpt-5.6-sol
  api_version: 2024-12-01-preview
  api_key_env: AZURE_OPENAI_API_KEY
  temperature: 0.0
  max_output_tokens: 4096

search:
  backend: gym
  top_k: 5
  corpus: fineweb
  cache: true

budget:
  max_steps: 12
  max_searches: 6
  max_reads: 8
  max_tokens: 24000
  max_latency_s: 180.0
  max_evidence: 24
  enforce: false

eval:
  official_benches:
    - deep_research_gym
