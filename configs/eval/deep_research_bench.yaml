name: deep_research_bench
# Official RACE + FACT pipeline. Leave third_party_dir null to let the harness
# search third_party/, then ADR_DRB_DIR, then a sibling clone.
third_party_dir: null
query_file: data/benchmarks/deep_research_bench/query.jsonl

# RACE and FACT use an OpenAI-compatible backend (LLM_BACKEND=openai|openrouter).
# Set OPENAI_API_KEY or OPENROUTER_API_KEY accordingly.
# FACT additionally scrapes cited pages and needs JINA_API_KEY.
language: en
workers: 4
skip_cleaning: false
run_race: true
run_fact: true

timeout_s: null
